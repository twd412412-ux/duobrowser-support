<div id="riverside"><section><h2>沿河走一走</h2><p>走过桥后，车流声渐渐远去。夕阳在水面铺开，沿岸的台阶旁有一排长椅。展开屏幕时，可以从这一段接着读。</p></section></div>
<section><h2>走回街灯下</h2><p>回程时，街灯在水面上拉出细长的倒影。保存这个阅读位置，下次打开可以继续看。</p></section>
