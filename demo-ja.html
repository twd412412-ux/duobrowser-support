<div id="riverside"><section><h2>川沿いの小さな寄り道</h2><p>橋を渡ると車の音が遠のき、川面の光が歩道を照らす。水辺に向かう階段を下りて、ベンチでひと休み。画面を開いても、この段落から続きを読めます。</p></section></div>
<section><h2>夕暮れの帰り道</h2><p>並木道を戻るころには、街灯が水面に細長く映る。次に訪れるときのために、この場所を保存しておきましょう。</p></section>
